services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: cucumber
      POSTGRES_PASSWORD: cucumber
      POSTGRES_DB: cucumber
    ports:
      - '5432:5432'
    volumes:
      - cucumber-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cucumber -d cucumber']
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: .
    profiles: ['app']
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://cucumber:cucumber@postgres:5432/cucumber?schema=public
      SESSION_SECRET: ${SESSION_SECRET:-dev-secret-change-me-dev-secret-change-me}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_DISPLAY_NAME: ${ADMIN_DISPLAY_NAME:-Admin}
      PORT: '8080'
    ports:
      - '8080:8080'

volumes:
  cucumber-pgdata:
